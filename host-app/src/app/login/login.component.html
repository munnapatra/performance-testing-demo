<div class="login-container">

  <div class="login-card">

    <h1>Performance Demo</h1>

    <h2>Login</h2>

    <div class="form-group">

      <label>Username</label>

      <input
        type="text"
        [(ngModel)]="username"
        placeholder="Enter username">
    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter password">
    </div>

    <button (click)="login()">
      Login
    </button>

  </div>

</div>
